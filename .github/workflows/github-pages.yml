name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare static export
        run: |
          rm -rf src/app/api src/middleware.ts
          node scripts/prepare-github-pages.mjs
          rm -rf src/app/api src/middleware.ts

      - name: Verify server routes removed
        run: |
          if [ -d src/app/api ]; then
            echo "ERROR: src/app/api must not exist for static export"
            ls -la src/app/
            exit 1
          fi
          if [ -f src/middleware.ts ]; then
            echo "ERROR: src/middleware.ts must not exist for static export"
            exit 1
          fi
          echo "OK — ready for static export"

      - name: Clean Next cache
        run: rm -rf .next

      - name: Build for GitHub Pages
        run: npx next build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_STATIC_EXPORT: "true"
          NEXT_PUBLIC_SITE_URL: https://mryamaslam.github.io/fashion_bridge
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}

      - name: Verify export output
        run: node scripts/verify-github-pages.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
